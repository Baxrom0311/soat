# Everything that can be checked without a hospital, checked on every push.
#
# Written after an audit found 96 tests that only ran when somebody remembered to run
# them. In this same session a change broke the Flutter suite and was caught only
# because `flutter test` happened to be typed; the whole point of this file is that
# "happened to be typed" stops being part of the process.
#
# The three suites run as separate jobs so a red Flutter run still tells you whether the
# server is fine. Nothing here deploys: deployment stays a deliberate act (server/deploy.sh).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run of the same branch irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        # A real Postgres, because the tests assert on native enum types, ON CONFLICT
        # against a named constraint, and the atomic UPDATE that keeps two nurses from
        # both acknowledging one call. SQLite would answer differently to all three.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Lint
        working-directory: server
        # Added after a review found Python was the only component without a
        # linter -- 6,843 lines held to style by discipline alone, while Dart and
        # TypeScript had this automated. It found a shadowed import and eleven
        # broken exception chains on its first run.
        run: |
          pip install ruff
          ruff check --config ../ruff.toml .
          ruff format --check --config ../ruff.toml .

      - name: Tests
        working-directory: server
        # --cov-fail-under is a ratchet, not a target. It is set just below where
        # coverage actually stands, so the build fails when a change makes the
        # tested fraction smaller -- and the number gets raised deliberately when
        # it rises, never lowered to make a red build go green.
        #
        # Before this, 162 tests existed and nobody could say what fraction of the
        # code they touched.
        run: python -m pytest -q --cov=app --cov-report=term --cov-fail-under=57

      - name: Migrations apply to an empty database
        working-directory: server
        # The tests build the schema from the models; this checks the other path -- that
        # a fresh server can actually be brought up from the migration chain. The two
        # drifting apart is how a migration that was never run on anything but a copy of
        # production ends up broken.
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/migration_check
        run: |
          psql "$TEST_PG_ADMIN_URL" -q -c 'CREATE DATABASE migration_check'
          alembic upgrade head
          alembic check

  web:
    name: Dashboard (vitest + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      - run: npm ci
        working-directory: web-dashboard
      - run: npx vitest run
        working-directory: web-dashboard
      - run: npm run lint
        working-directory: web-dashboard
      # `build` runs the design-token check and tsc before vite, so this covers both.
      - run: npm run build
        working-directory: web-dashboard

  mobile:
    name: Nurse app (flutter test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile-flutter
      - run: flutter analyze
        working-directory: mobile-flutter
      - run: flutter test
        working-directory: mobile-flutter

  watch:
    name: Ward watch (gradle test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Unit tests only, not a build: assembling the watch APK needs the release
      # keystore, which is not in the repository and must not be. The logic worth
      # protecting -- reading the nurse's name out of a token that arrives over
      # Bluetooth from the phone -- is plain JVM code and runs here.
      - run: chmod +x gradlew
      - run: ./gradlew :app:testReleaseUnitTest
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: watch-test-report
          path: app/build/reports/tests/

  firmware:
    name: ESP32 firmware (pio run)
    runs-on: ubuntu-latest
    # Compiles the receiver firmware on every push. Until this job existed, the only
    # check on main.cpp was somebody flashing a device, so a change that did not
    # build was found at the clinic.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('esp32-firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run
        working-directory: esp32-firmware
