    <script>
      // Day theme is the baseline, night is opt-in via the in-app toggle -- we do NOT
      // follow prefers-color-scheme. A nurse station's OS being in dark mode should
      // not decide what the clinic's dashboard looks like; only an explicit choice does.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
