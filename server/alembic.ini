[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Placeholder only -- migrations/env.py OVERRIDES this at runtime with the exact
# DATABASE_URL app/core/config.py resolves (same .env, same fallback), so alembic.ini's
# url is never actually used to connect anywhere. Do not rely on this value.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
