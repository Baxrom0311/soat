; PlatformIO Project Configuration File
;
; Nurse-call ESP32 firmware — har qavatdagi 433MHz EV1527 SOS tugma signalini
; qabul qilib, markaziy backend serverga POST qiladi.
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; 6.x'ga mahkamlangan: Arduino core 2.x / IDF 4.4 — main.cpp'dagi
; esp_task_wdt_init(timeout, panic) imzosi shu core'ga mos. Core 3.x (IDF 5)
; API'ni o'zgartirgan, ko'r-ko'rona upgrade kompilyatsiyani sindiradi.
platform = espressif32@^6
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    sui77/rc-switch@^2.6.4
    bblanchon/ArduinoJson@^7.4.3
    tzapu/WiFiManager@^2.0.17
    ; WiFi.h va HTTPClient.h ESP32 Arduino core tarkibida keladi, alohida qo'shish shart emas
