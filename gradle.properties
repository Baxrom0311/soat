org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# JDK is NOT pinned here. This file used to carry
# org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-17.jdk/... which is
# one developer's Mac and nothing else -- it broke the first CI run that touched this
# module, and would break any new machine the same way. Gradle finds the JDK from
# JAVA_HOME; a machine that needs a specific one sets it in local.properties, which is
# gitignored precisely because it is local.
