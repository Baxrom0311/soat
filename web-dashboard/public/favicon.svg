<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A6AFA" />
      <stop offset="100%" stop-color="#0048B3" />
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A101D" />
      <stop offset="100%" stop-color="#141E33" />
    </linearGradient>
    <linearGradient id="pulseGlowLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>
    <linearGradient id="pulseGlowDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    .bg { fill: url(#bgLight); rx: 16px; }
    .cross { fill: rgba(255, 255, 255, 0.22); }
    .pulse { stroke: url(#pulseGlowLight); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .beacon { fill: #E0F2FE; }
    .beacon-core { fill: #FFFFFF; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: url(#bgDark); stroke: rgba(0, 229, 255, 0.4); stroke-width: 1.5; rx: 16px; }
      .cross { fill: rgba(0, 229, 255, 0.15); }
      .pulse { stroke: url(#pulseGlowDark); filter: url(#glowDark); }
      .beacon { fill: #00E5FF; }
      .beacon-core { fill: #FFFFFF; }
    }
  </style>
  <rect class="bg" width="64" height="64" />
  <!-- Medical Cross Geometry -->
  <path class="cross" d="M26 12h12v14h14v12H38v14H26V38H12V26h14V12z" />
  <!-- Lifeline ECG Pulse Curve -->
  <path class="pulse" d="M10 33h11l4-11 7 22 5-15 4 4h13" />
  <!-- Broadcast Signal Dot -->
  <circle class="beacon" cx="41" cy="33" r="3" />
  <circle class="beacon-core" cx="41" cy="33" r="1.5" />
</svg>
