<style>
  @layer base {
    html, body {
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 
      0 24px 50px -12px rgba(2, 132, 199, 0.16),

      0 -1px 3px 0 rgba(2, 132, 199, 0.08) inset;
  }

  .ice-input-box {
    background: rgba(255, 255, 255, 0.58);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1.5px solid rgba(255, 255, 255, 0.95);
    box-shadow: 
      inset 0 2px 4px 0 rgba(2, 97, 148, 0.04),
      0 2px 6px -1px rgba(0, 0, 0, 0.02);
    transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .ice-input-box:focus-within {
    background: rgba(255, 255, 255, 0.92);
    border-color: #38bdf8;
    box-shadow: 
      0 0 0 3.5px rgba(56, 189, 248, 0.25),
      inset 0 1px 2px 0 rgba(2, 97, 148, 0.03);
  }

  .ice-badge-pill {
    background: rgba(255, 255, 255, 0.68);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 4px 14px -3px rgba(2, 132, 199, 0.1);
  }

  .cta-liquid {
    background: linear-gradient(135deg, #0284c7 0%, #006194 50%, #0369a1 100%);
    box-shadow: 
      0 12px 28px -6px rgba(0, 97, 148, 0.42),
      inset 0 1px 1.5px rgba(255, 255, 255, 0.5),
      inset 0 -1.5px 2px rgba(0, 30, 60, 0.25);
  }

  /* Shimmer Light Sweep on CTA */
  .shimmer-layer::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -150%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
      60deg, 
      transparent 20%, 
      rgba(255, 255, 255, 0.35) 50%, 
      transparent 80%
    );
    animation: shimmerSweep 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    pointer-events: none;
  }

  @keyframes shimmerSweep {
    0% { transform: translateX(0); }
    50% { transform: translateX(120%); }
    100% { transform: translateX(120%); }
  }

  /* Floating Liquid Orbs */
  @keyframes floatSlow1 {
    0%, 100% { transform: translate(0px, 0px) scale(1); }
    50% { transform: translate(25px, 20px) scale(1.08); }
  }
  @keyframes floatSlow2 {
    0%, 100% { transform: translate(0px, 0px) scale(1); }
    50% { transform: translate(-30px, -25px) scale(1.12); }
  }
  @keyframes floatSlow3 {
    0%, 100% { transform: translate(0px, 0px) scale(1); }
    50% { transform: translate(20px, -30px) scale(0.94); }
  }
  .animate-float-1 { animation: floatSlow1 9s ease-in-out infinite; }
  .animate-float-2 { animation: floatSlow2 12s ease-in-out infinite; }
  .animate-float-3 { animation: floatSlow3 10s ease-in-out infinite; }

  /* Logo Glow & Pulse */
  @keyframes breathingGlow {
    0%, 100% {
      transform: scale(1);
      filter: drop-shadow(0 8px 24px rgba(56, 189, 248, 0.38));
    }
    50% {
      transform: scale(1.04);
      filter: drop-shadow(0 14px 34px rgba(2, 132, 199, 0.6));
    }
  }
  .animate-breathing-logo {
    animation: breathingGlow 4.5s ease-in-out infinite;
  }

  /* Ripple Waves in Splash */
  @keyframes medicalWave {
    0% {
      transform: scale(0.85);
      opacity: 0.85;
    }
    100% {
      transform: scale(2.4);
      opacity: 0;
    }
  }
  .animate-wave-1 {
    animation: medicalWave 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
  }
  .animate-wave-2 {
    animation: medicalWave 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 0.75s;
  }
  .animate-wave-3 {
    animation: medicalWave 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 1.5s;
  }

  /* Splash Logo Scale Entry */
  @keyframes logoReveal {
    0% {
      transform: scale(0.65);
      opacity: 0;
      filter: blur(8px);
    }
    60% {
      transform: scale(1.06);
      opacity: 1;
      filter: blur(0px);
    }
    100% {
      transform: scale(1);
      opacity: 1;
      filter: blur(0px);
    }
  }
  .animate-logo-reveal {
    animation: logoReveal 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* Staggered Reveal Items in Main View */
  .reveal-item {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);

  }

    opacity: 0;
    transform: scale(1.08) translateY(-14px);
    visibility: hidden;
    pointer-events: none;

</style>

<script>
  let splashTimeout = null;
  let progressInterval = null;

  // Staggered trigger for Login Form components
  function revealLoginElements() {
    const items = document.querySelectorAll('.reveal-item');
    items.forEach((item, index) => {
      setTimeout(() => {
        item.classList.add('revealed');
      }, index * 120);
    });
  }

  function hideLoginElements() {
    const items = document.querySelectorAll('.reveal-item');
    items.forEach(item => {
      item.classList.remove('revealed');
    });
  }

  // Dismiss Splash and transition smoothly to Login View
  function dismissSplash() {
    if (splashTimeout) clearTimeout(splashTimeout);
    if (progressInterval) clearInterval(progressInterval);

    const splash = document.getElementById('splashScreen');
    const bar = document.getElementById('splashProgressBar');
    if (bar) bar.style.width = '100%';

    splash.classList.add('splash-hidden');
    setTimeout(() => {
      splash.style.display = 'none';
      revealLoginElements();
    }, 550);
  }

  // Run or replay Splash presentation
  function startSplashFlow() {
    const splash = document.getElementById('splashScreen');
    const bar = document.getElementById('splashProgressBar');
    const statusText = document.getElementById('splashStatusText');

    hideLoginElements();
    splash.style.display = 'flex';
    splash.classList.remove('splash-hidden');
    bar.style.width = '0%';
    statusText.textContent = "Klinika tarmog'i ulanmoqda...";

    let progress = 0;
    if (progressInterval) clearInterval(progressInterval);
    progressInterval = setInterval(() => {
      progress += 6;
      if (progress > 100) progress = 100;
      bar.style.width = progress + '%';

      if (progress > 45 && progress < 85) {
        statusText.textContent = "Shifrlangan sessiya o'rnatilmoqda...";
      } else if (progress >= 85) {
        statusText.textContent = "Tizim tayyorlandi";
      }

      if (progress >= 100) {
        clearInterval(progressInterval);
      }
    }, 85);

    if (splashTimeout) clearTimeout(splashTimeout);
    splashTimeout = setTimeout(() => {
      dismissSplash();
    }, 1850);
  }

  function replaySplash() {
    startSplashFlow();
  }

  // On page load start the Glacier Splash Screen
  window.addEventListener('DOMContentLoaded', () => {
    startSplashFlow();
  });

  // Role Switcher
  function setRole(button, roleName) {
    document.querySelectorAll('.role-btn').forEach(btn => {
      btn.classList.remove('bg-white', 'text-sky-800', 'shadow-sm', 'font-bold');
      btn.classList.add('text-slate-600', 'font-medium');
    });
    button.classList.add('bg-white', 'text-sky-800', 'shadow-sm', 'font-bold');
    button.classList.remove('text-slate-600', 'font-medium');

    const roleBadge = document.getElementById('roleBadge');
    roleBadge.textContent = roleName + ' profili';

    const usernameInput = document.getElementById('usernameInput');
    if (roleName === 'Hamshira') {
      usernameInput.placeholder = 'nurse@clinic.uz yoki ID-7842';
    } else if (roleName === 'Shifokor') {
      usernameInput.placeholder = 'doctor@clinic.uz yoki ID-3310';
    } else {
      usernameInput.placeholder = 'admin@clinic.uz yoki ID-1001';
    }
  }

  // Password Visibility Toggle
  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  // Biometric Quick Authentication
  function triggerBiometric() {
    const btn = document.getElementById('submitButton');
    const text = document.getElementById('buttonText');
    const icon = document.getElementById('buttonIcon');
    
    text.textContent = 'Biometrik tekshirilmoqda...';
    icon.textContent = 'fingerprint';
    btn.disabled = true;

    setTimeout(() => {
      text.textContent = 'Identifikatsiya qilindi';
      icon.textContent = 'verified';
      btn.classList.remove('cta-liquid');
      btn.classList.add('bg-emerald-600', 'shadow-emerald-600/30');

      setTimeout(() => {
        text.textContent = 'Tizimga kirish';
        icon.textContent = 'arrow_forward';
        btn.classList.remove('bg-emerald-600', 'shadow-emerald-600/30');
        btn.classList.add('cta-liquid');
        btn.disabled = false;
      }, 1400);
    }, 1100);
  }

  // Form Submission
  function handleAuth() {
    const btn = document.getElementById('submitButton');
    const text = document.getElementById('buttonText');
    const icon = document.getElementById('buttonIcon');
    
    text.textContent = 'Tekshirilmoqda...';
    icon.textContent = 'sync';
    icon.classList.add('animate-spin');
    btn.disabled = true;

    setTimeout(() => {
      text.textContent = 'Muvaffaqiyatli';
      icon.classList.remove('animate-spin');
      icon.textContent = 'check_circle';
      btn.classList.remove('cta-liquid');
      btn.classList.add('bg-emerald-600', 'shadow-emerald-600/30');
      
      setTimeout(() => {
        text.textContent = 'Tizimga kirish';
        icon.textContent = 'arrow_forward';
        btn.classList.remove('bg-emerald-600', 'shadow-emerald-600/30');
        btn.classList.add('cta-liquid');
        btn.disabled = false;
      }, 1600);
    }, 1000);
  }
</script>
